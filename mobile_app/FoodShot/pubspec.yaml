name: srilankani_food_recognition
description: "A Flutter app for Sri Lankan food recognition using AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # On-device inference (TFLite)
  tflite_flutter: ^0.12.1

  # Image processing
  image_picker: ^1.0.4
  image: ^4.1.3

  # File / URL utilities
  path_provider: ^2.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/model.tflite
    - assets/prototypes.json
    - assets/labels.txt
    - assets/model_info.json
