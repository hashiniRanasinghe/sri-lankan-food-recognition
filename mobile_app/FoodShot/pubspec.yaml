name: srilankani_food_recognition
description: Few-shot food recognition app for Sri Lankan cuisine

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  
  # Image handling
  image_picker: ^1.1.2
  image: ^4.1.3
  
  # Model inference (we'll use this later when model is ready)
  tflite_flutter: ^0.10.4
  
  # File handling
  path_provider: ^2.1.1
  
  # HTTP requests (if needed for API)
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  # Assets (we'll add model files later)
  assets:
    - assets/images/
    - assets/model/
    # - assets/model/food_model.tflite  # Add when model is ready